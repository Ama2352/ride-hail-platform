---
# playbook_ngrok_sonarqube.yml
# Simple ngrok installer for k8s-master.
# After provisioning, run manually as vagrant user:
#   ngrok config add-authtoken <YOUR_TOKEN>
#   ngrok http 80
- name: Install ngrok CLI
  hosts: all
  connection: local
  become: true
  vars:
    ngrok_zip_url: "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.zip"
    ngrok_zip_path: "/tmp/ngrok-v3-stable-linux-amd64.zip"
    ngrok_bin_path: "/usr/local/bin/ngrok"

  tasks:
    - name: Install OS dependencies
      ansible.builtin.apt:
        name:
          - unzip
          - curl
        state: present
        update_cache: true

    - name: Check if ngrok is already installed
      ansible.builtin.stat:
        path: "{{ ngrok_bin_path }}"
      register: ngrok_bin

    - name: Download ngrok archive
      ansible.builtin.get_url:
        url: "{{ ngrok_zip_url }}"
        dest: "{{ ngrok_zip_path }}"
        mode: "0644"
      when: not ngrok_bin.stat.exists

    - name: Install ngrok binary
      ansible.builtin.unarchive:
        src: "{{ ngrok_zip_path }}"
        dest: "/usr/local/bin"
        remote_src: true
        mode: "0755"
      when: not ngrok_bin.stat.exists

    - name: Ensure ngrok binary permissions
      ansible.builtin.file:
        path: "{{ ngrok_bin_path }}"
        mode: "0755"
        owner: root
        group: root

    - name: Verify ngrok command is available
      ansible.builtin.command: ngrok version
      register: ngrok_version_output
      changed_when: false

    - name: Show manual usage
      ansible.builtin.debug:
        msg:
          - "ngrok installed: {{ ngrok_version_output.stdout }}"
          - "Run as vagrant user:"
          - "  ngrok config add-authtoken <YOUR_TOKEN>"
          - "  ngrok http 80"
